apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "latest 태그는 사용할 수 없습니다. 명시적인 버전을 사용하세요."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
