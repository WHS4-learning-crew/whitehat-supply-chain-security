# falco 네임스페이스 admin RoleBinding만 유지. falco-installer ClusterRole/ClusterRoleBinding은 10/6 회수됨
# (릴리스가 클러스터 범위 리소스를 관리하지 않음, 계정 ID는 ${AWS_ACCOUNT_ID}로 치환)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sungyujeong-falco-ns-admin
  namespace: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: arn:aws:iam::${AWS_ACCOUNT_ID}:user/sungyujeong
