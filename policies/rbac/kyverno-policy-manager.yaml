# 클러스터 적용 상태에서 추출 (계정 ID는 ${AWS_ACCOUNT_ID}로 치환)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-policy-manager
rules:
- apiGroups:
  - kyverno.io
  resources:
  - clusterpolicies
  - policies
  - policyreports
  - clusterpolicyreports
  - policyexceptions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - policies.kyverno.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: parkseonghyeon-kyverno-policy-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-policy-manager
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: arn:aws:iam::${AWS_ACCOUNT_ID}:user/parkseonghyeon
