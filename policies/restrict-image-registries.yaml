apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Audit        # 먼저 기록만, 9/24 이후 Enforce 전환 여부 결정
  background: true
  rules:
    - name: allow-ecr-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["ns-*"]      # 팀원 네임스페이스만 대상
      validate:
        message: "허용된 레지스트리(ECR)의 이미지만 배포할 수 있습니다."
        pattern:
          spec:
            =(initContainers):
              - image: "984675940604.dkr.ecr.ap-northeast-2.amazonaws.com/*"
            containers:
              - image: "984675940604.dkr.ecr.ap-northeast-2.amazonaws.com/*"
