apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: falco-root-exception
  namespace: falco
spec:
  exceptions:
  - policyName: disallow-root-user
    ruleNames:
    - check-runAsNonRoot
    - autogen-check-runAsNonRoot
  match:
    any:
    - resources:
        namespaces:
        - falco
        kinds:
        - Pod
        - DaemonSet
        - Deployment
        - StatefulSet
