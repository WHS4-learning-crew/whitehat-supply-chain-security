name: Scenario A-1 Test (Log4Shell)

on:
  push:
    branches:
      - test/a1-trivy-block

permissions:
  contents: read

jobs:
  # ============================================
  # Job 1: 취약 버전(2.14.1) - 차단되어야 함
  # ============================================
  test-log4j-vulnerable-block:
    name: Log4Shell 차단 검증 (취약 버전 2.14.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image (log4j 2.14.1, transitive dependency)
        run: |
          docker build \
            -f test-scenarios/a1-log4shell/Dockerfile \
            -t log4j-transitive-test:vulnerable \
            test-scenarios/a1-log4shell/

      - name: Trivy scan (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: log4j-transitive-test:vulnerable
          format: json
          output: a1-scan-results.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Check Log4Shell CVE detected and enforce block
        run: |
          echo "=== Log4j 관련 CVE 전체 ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.PkgName | test("log4j"; "i"))
            ]
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-scan-results.json | tee a1-log4j-cves.tsv

          LOG4J_COUNT=$(wc -l < a1-log4j-cves.tsv | tr -d ' ')

          echo ""
          echo "=== (참고) 전체 CRITICAL 목록 - log4j 외 포함 ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL" and .FixedVersion != null and .FixedVersion != "")
            ]
            | unique_by(.VulnerabilityID)
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-scan-results.json | tee a1-unique-cves-critical.tsv

          echo ""
          echo "Log4j 관련 CVE: $LOG4J_COUNT 건 (차단 여부 판정 기준)"
          echo "전체 CRITICAL: $(wc -l < a1-unique-cves-critical.tsv | tr -d ' ') 건 (참고용, log4j 외 별개 이슈 가능)"

          if [ "$LOG4J_COUNT" -gt 0 ]; then
            echo "::error::Log4j 관련 CVE ${LOG4J_COUNT}건 발견 — Job 실패 (기대된 결과: 차단됨)"
            exit 1
          else
            echo "::error::Log4j 관련 CVE가 검출되지 않음 — 기대와 다른 결과 (탐지 실패)"
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-vulnerable-report
          path: |
            a1-scan-results.json
            a1-log4j-cves.tsv
            a1-unique-cves-critical.tsv
          retention-days: 7

  # ============================================
  # Job 2: 대조군 - 패치 버전 - log4j 기준으로만 판정 (spring-web/tomcat 등
  # 별개 CVE는 참고용으로만 출력, fail 판정에는 포함하지 않음)
  # ============================================
  test-log4j-patched-pass:
    name: Log4Shell 대조군 검증 (패치 버전)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image (log4j patched)
        run: |
          docker build \
            -f test-scenarios/a1-log4shell-patched/Dockerfile \
            -t log4j-transitive-test:patched \
            test-scenarios/a1-log4shell-patched/

      - name: Trivy scan (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: log4j-transitive-test:patched
          format: json
          output: a1-patched-results.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Check log4j patched (control group should pass)
        run: |
          echo "=== Log4j 관련 CVE 전체 (패치 버전) ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.PkgName | test("log4j"; "i"))
            ]
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-patched-results.json | tee a1-patched-log4j-cves.tsv

          LOG4J_COUNT=$(wc -l < a1-patched-log4j-cves.tsv | tr -d ' ')

          echo ""
          echo "=== (참고) 전체 CRITICAL 목록 - log4j 외 포함 ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL" and .FixedVersion != null and .FixedVersion != "")
            ]
            | unique_by(.VulnerabilityID)
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-patched-results.json | tee a1-patched-unique-critical.tsv

          echo ""
          echo "Log4j 관련 CVE: $LOG4J_COUNT 건 (패치 여부 판정 기준)"
          echo "전체 CRITICAL: $(wc -l < a1-patched-unique-critical.tsv | tr -d ' ') 건 (참고용, log4j 외 별개 이슈 가능)"

          if [ "$LOG4J_COUNT" -gt 0 ]; then
            echo "::error::Log4j 관련 CVE ${LOG4J_COUNT}건 검출됨 — 패치 실패"
            exit 1
          else
            echo "Log4j 관련 CVE 없음 — 패치 확인됨 (목표 달성)"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-patched-report
          path: |
            a1-patched-results.json
            a1-patched-log4j-cves.tsv
            a1-patched-unique-critical.tsv
          retention-days: 7