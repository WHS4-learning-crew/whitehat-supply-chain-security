name: Scenario A-1 Test (Log4Shell)

on:
  push:
    branches:
      - test/a1-trivy-block

permissions:
  contents: read

jobs:
  # ============================================
  # Job 1: 취약 버전(2.14.1) - 차단되어야 함
  # ============================================
  test-log4j-vulnerable-block:
    name: Log4Shell 차단 검증 (취약 버전 2.14.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image (log4j 2.14.1, transitive dependency)
        run: |
          docker build \
            -f test-scenarios/a1-log4shell/Dockerfile \
            -t log4j-transitive-test:vulnerable \
            test-scenarios/a1-log4shell/

      - name: Trivy scan (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: log4j-transitive-test:vulnerable
          format: json
          output: a1-scan-results.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Check Log4Shell CVE detected and enforce block
        run: |
          echo "=== Log4j 관련 CVE 전체 ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.PkgName | test("log4j"; "i"))
            ]
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-scan-results.json | tee a1-log4j-cves.tsv

          echo ""
          echo "=== 실제 trivy-scan job과 동일한 fail 기준 재현 ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL" and .FixedVersion != null and .FixedVersion != "")
            ]
            | unique_by(.VulnerabilityID)
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-scan-results.json | tee a1-unique-cves-critical.tsv

          CRITICAL_COUNT=$(wc -l < a1-unique-cves-critical.tsv | tr -d ' ')
          echo ""
          echo "CRITICAL 고유 CVE: $CRITICAL_COUNT 건"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::CRITICAL 등급 고유 CVE ${CRITICAL_COUNT}건 발견 — Job 실패 (기대된 결과: 차단됨)"
            exit 1
          else
            echo "::error::CRITICAL CVE가 검출되지 않음 — 기대와 다른 결과 (탐지 실패)"
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-vulnerable-report
          path: |
            a1-scan-results.json
            a1-log4j-cves.tsv
            a1-unique-cves-critical.tsv
          retention-days: 7

  # ============================================
  # Job 2: 대조군 - 패치 버전(2.17.1) - 정상 통과해야 함
  # ============================================
  test-log4j-patched-pass:
    name: Log4Shell 대조군 검증 (패치 버전 2.17.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image (log4j 2.17.1, transitive dependency)
        run: |
          docker build \
            -f test-scenarios/a1-log4shell-patched/Dockerfile \
            -t log4j-transitive-test:patched \
            test-scenarios/a1-log4shell-patched/

      - name: Trivy scan (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: log4j-transitive-test:patched
          format: json
          output: a1-patched-results.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Check no CRITICAL detected (control group should pass)
        run: |
          echo "=== Log4j 관련 CVE 전체 (패치 버전) ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.PkgName | test("log4j"; "i"))
            ]
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-patched-results.json | tee a1-patched-log4j-cves.tsv

          echo ""
          echo "=== 실제 trivy-scan job과 동일한 fail 기준 재현 ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL" and .FixedVersion != null and .FixedVersion != "")
            ]
            | unique_by(.VulnerabilityID)
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' a1-patched-results.json | tee a1-patched-unique-critical.tsv

          CRITICAL_COUNT=$(wc -l < a1-patched-unique-critical.tsv | tr -d ' ')
          echo ""
          echo "CRITICAL 고유 CVE: $CRITICAL_COUNT 건"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::패치된 버전인데도 CRITICAL CVE ${CRITICAL_COUNT}건 검출됨 — 기대와 다른 결과 (오탐 아님, 실제 이슈 가능성)"
            exit 1
          else
            echo "CRITICAL CVE 없음 — 정상 통과 (기대된 결과)"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-patched-report
          path: |
            a1-patched-results.json
            a1-patched-log4j-cves.tsv
            a1-patched-unique-critical.tsv
          retention-days: 7
