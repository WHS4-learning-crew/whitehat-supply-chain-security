name: CI Security Pipeline

on:
  push:
    branches:
      - feat/ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write   # OIDC 인증용 (ECR push, Cosign keyless 서명에 필요)

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . -v

  iac-scan:
    name: Checkov + tfsec
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov - Dockerfile
        run: |
          checkov -d . \
            --framework dockerfile \
            --compact \
            --quiet

      - name: Checkov - Kubernetes
        run: |
          checkov -d . \
            --framework kubernetes \
            --compact \
            --quiet

      - name: Checkov - GitHub Actions
        run: |
          checkov -d . \
            --framework github_actions \
            --compact \
            --quiet

      - name: tfsec - Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra-rbac/
          additional_args: --minimum-severity HIGH

  sbom-diff:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: iac-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json > sbom-current.json

      - name: Check SBOM
        run: |
          test -s sbom-current.json
          echo "SBOM generated successfully"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sbom-diff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: whitehat-demo:latest
          outputs: type=docker,dest=/tmp/whitehat-demo.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/whitehat-demo.tar
          retention-days: 1

  # trivy-job 연결
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/whitehat-demo.tar

      - name: Trivy scan (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: whitehat-demo:latest
          format: json
          output: trivy-results.json
          exit-code: '0'        # 실패 판단은 후처리 step에서 함
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Post-process (unique CVE + Fixed Version 재집계)
        run: |
          echo "=== Trivy 재집계 결과 ==="

          jq -r '
            [.Results[]?.Vulnerabilities[]?
              | select(.FixedVersion != null and .FixedVersion != "")
            ]
            | unique_by(.VulnerabilityID)
            | .[]
            | "\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion)\t\(.Severity)"
          ' trivy-results.json | tee unique-cves.tsv

          COUNT=$(wc -l < unique-cves.tsv | tr -d ' ')
          echo ""
          echo "고유 CVE (Fixed Version 존재) 개수: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::CRITICAL 등급 + 패치 가능한 고유 CVE ${COUNT}건 발견 — Job 실패"
            exit 1
          else
            echo "패치 가능한 CRITICAL CVE 없음 — 통과"
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-results.json
            unique-cves.tsv
          retention-days: 7

  ecr-push:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: trivy-scan
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
      image_digest_uri: ${{ steps.push.outputs.image_digest_uri }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/whitehat-demo.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984675940604:role/GitHubActionsECRRole
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        id: push
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/whs4-demo-app:${{ github.sha }}"
          docker tag whitehat-demo:latest "$IMAGE_URI"
          # push 결과에서 digest를 뽑아서, 이후 cosign 서명은 tag가 아니라 digest로 고정한다
          DIGEST=$(docker push "$IMAGE_URI" | grep -oP 'digest: \Ksha256:[a-f0-9]+')
          IMAGE_DIGEST_URI="${{ steps.ecr-login.outputs.registry }}/whs4-demo-app@${DIGEST}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_digest_uri=$IMAGE_DIGEST_URI" >> "$GITHUB_OUTPUT"

  cosign-sign:
    name: Cosign Keyless Sign
    runs-on: ubuntu-latest
    needs: ecr-push

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984675940604:role/GitHubActionsECRRole
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sign image
        run: cosign sign --yes ${{ needs.ecr-push.outputs.image_digest_uri }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # 참고: certificate-identity / certificate-oidc-issuer 값은 이 sign 단계가 아니라
      # Kyverno 검증 정책 쪽에 설정하는 값입니다.
      # 계산값(참고용): identity=https://github.com/WHS4-learning-crew/whitehat-supply-chain-security/.github/workflows/ci-pipeline.yml@refs/heads/feat/ci-pipeline
      #                issuer=https://token.actions.githubusercontent.com
