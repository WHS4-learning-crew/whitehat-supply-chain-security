name: CI Security Pipeline

on:
  push:
    branches:
      - feat/ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . -v


  iac-scan:
    name: Checkov + tfsec
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov - Dockerfile
        run: |
          checkov -d . \
            --framework dockerfile \
            --compact \
            --quiet

      - name: Checkov - Kubernetes
        run: |
          checkov -d . \
            --framework kubernetes \
            --compact \
            --quiet

      - name: Checkov - GitHub Actions
        run: |
          checkov -d . \
            --framework github_actions \
            --compact \
            --quiet

      - name: tfsec - Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra-rbac/
          additional_args: --minimum-severity HIGH


  # 3. SBOM 생성
  sbom-diff:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: iac-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json > sbom-current.json

      - name: Check SBOM
        run: |
          test -s sbom-current.json
          echo "SBOM generated successfully"


    # 4. Docker Image Build
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sbom-diff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: whitehat-demo:latest

    # 5. Trivy 이미지 취약점 검사
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: whitehat-demo:latest

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: whitehat-demo:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true