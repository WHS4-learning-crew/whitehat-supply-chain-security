name: CI Security Pipeline

on:
  push:
    branches:
      - feat/ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . -v

  iac-scan:
    name: Checkov + tfsec
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov - Dockerfile
        run: |
          checkov -d . \
            --framework dockerfile \
            --compact \
            --quiet

      - name: Checkov - Kubernetes
        run: |
          checkov -d . \
            --framework kubernetes \
            --compact \
            --quiet

      - name: Checkov - GitHub Actions
        run: |
          checkov -d . \
            --framework github_actions \
            --compact \
            --quiet

      - name: tfsec - Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra-rbac/
          additional_args: --minimum-severity HIGH
