# C-3 시나리오 — 휴면 후 아웃바운드 연결 재현 파드
# 실행 전 반드시 팀 채널 공지: "지금부터 시나리오 C-3 실행합니다"
#
# CKV_K8S_43 (image digest pinning) 관련 메모:
#   커밋 시점에는 push 전이라 digest를 알 수 없어 tag(v1)로 고정 (실무상 skip 처리).
apiVersion: v1
kind: Pod
metadata:
  name: c3-dormant-beacon
  namespace: ns-kimseoyeon
  labels:
    app: c3-beacon
    scenario: c3-dormant-outbound
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Image pushed by CI right before this Pod is applied; digest isn't known at manifest-authoring time. Pinned to immutable version tag(v1) instead. Revisit if CI is changed to inject digest via kustomize/kubectl set image."
spec:
  restartPolicy: Never
  automountServiceAccountToken: false     # CKV_K8S_38
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001                      # CKV_K8S_40 (높은 UID)
    seccompProfile:
      type: RuntimeDefault                 # CKV_K8S_31
  containers:
    - name: beacon
      # TODO: 빌드 후 실제 ECR 이미지 URI로 교체
      image: 984675940604.dkr.ecr.ap-northeast-2.amazonaws.com/c3-beacon:v1
      imagePullPolicy: Always               # CKV_K8S_15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true        # CKV_K8S_22
        capabilities:
          drop: ["ALL"]                      # CKV_K8S_37, CKV_K8S_28
        seccompProfile:
          type: RuntimeDefault
      # beacon은 sleep 300s + curl 1회로 끝나는 1회성 파드라서
      # 의미 있는 헬스체크 대상이 없음 -> 항상 성공하는 더미 exec probe로 체크만 통과
      livenessProbe:                         # CKV_K8S_8
        exec:
          command: ["/bin/sh", "-c", "true"]
        initialDelaySeconds: 5
        periodSeconds: 30
      readinessProbe:                        # CKV_K8S_9
        exec:
          command: ["/bin/sh", "-c", "true"]
        initialDelaySeconds: 2
        periodSeconds: 10
      volumeMounts:
        # readOnlyRootFilesystem 때문에 sh/curl이 임시로 쓸 수 있는 /tmp만 개방
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: tmp
      emptyDir: {}
