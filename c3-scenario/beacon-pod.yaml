# C-3 시나리오 — 휴면 후 아웃바운드 연결 재현 파드
# 실행 전 반드시 팀 채널 공지: "지금부터 시나리오 C-3 실행합니다"
apiVersion: v1
kind: Pod
metadata:
  name: c3-dormant-beacon
  namespace: ns-kimseoyeon
  labels:
    scenario: c3-dormant-outbound
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: beacon
      # TODO: 빌드 후 실제 ECR 이미지 URI로 교체
      image: 984675940604.dkr.ecr.ap-northeast-2.amazonaws.com/c3-beacon:v1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
