worker_processes 1;

events { worker_connections 64; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;

        location /beacon {
            access_log /dev/stdout;
            return 200 "beacon received\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 404;
        }
    }
}
